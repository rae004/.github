# Lint and format rules for scripts/ and tests/. CI pins the ruff version
# (.github/workflows/ci.yml), so a new ruff release cannot fail a PR by itself.
line-length = 100
target-version = "py312"

[lint]
# Named explicitly so a change in ruff's defaults cannot change what CI checks:
# pycodestyle errors (E4, E7, E9), pyflakes (F) and import sorting (I).
select = ["E4", "E7", "E9", "F", "I"]
