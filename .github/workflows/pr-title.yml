name: PR title

# Reusable check that a pull request title is a Conventional Commit. A repo
# calls it on pull_request and lists `title / Conventional title` among its
# required checks:
#
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#   jobs:
#     title:
#       uses: rae004/.github/.github/workflows/pr-title.yml@main
#
# The PR title becomes the squash commit message, which release.yml reads to
# decide the version. Both use scripts/next_version.py, so a title that passes
# here is one the release workflow understands.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      # The rules come from the same commit of rae004/.github as this workflow
      # file, so a pinned caller gets the rules of the release it pinned.
      # `job.workflow_*` describe the workflow file that defines this job;
      # `github.workflow_*` would describe the caller's.
      - name: Fetch the rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: scripts
          persist-credentials: false

      - name: Check the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_title.py
